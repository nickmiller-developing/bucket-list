<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everything We Still Get To Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #12132a;
    --bg-deep-2: #1c1e42;
    --paper: #faf6ec;
    --ink: #2c2440;
    --ink-soft: #504774;
    --gold: #f0c05a;
    --gold-soft: #e7b64f;
    --rose: #e98b93;
    --muted: #9a9bc4;
    --text: #f1eefb;
  }

  *{ box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  html, body{
    margin:0;
    min-height:100%;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-deep-2), var(--bg-deep) 65%);
    color: var(--text);
    font-family: 'Fraunces', serif;
    overflow-x: hidden;
  }

  #stars{
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .star{
    position: absolute;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 4px 1px rgba(255,255,255,.45);
    animation-name: twinkle;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes twinkle{
    0%, 100% { opacity: .12; }
    50% { opacity: .85; }
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 6rem;
  }

  header{
    text-align: center;
    margin-bottom: 3rem;
  }

  h1{
    font-size: clamp(2.1rem, 4.5vw + 1rem, 3.3rem);
    font-weight: 500;
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0 0 1.1rem;
  }

  .subtitle{
    font-size: clamp(1rem, .4vw + .95rem, 1.15rem);
    font-weight: 400;
    font-optical-sizing: auto;
    color: var(--muted);
    max-width: 46ch;
    margin: 0 auto 2.2rem;
    line-height: 1.55;
  }

  .progress-wrap{
    max-width: 360px;
    margin: 0 auto;
  }
  .progress-track{
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--rose));
    border-radius: 999px;
    transition: width .5s ease;
  }
  .progress-label{
    display: block;
    margin-top: .6rem;
    font-size: .92rem;
    color: var(--muted);
    letter-spacing: .01em;
  }

  .board{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 2.4rem 1.6rem;
    padding: 1rem .5rem;
  }

  .wish{
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    padding: 1.6rem 1.3rem 1.5rem;
    font-family: 'Caveat', cursive;
    font-size: 1.32rem;
    line-height: 1.32;
    box-shadow: 0 14px 24px -12px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.2);
    cursor: pointer;
    user-select: none;
    transition: transform .18s ease, box-shadow .18s ease, opacity .3s ease;
    transform: rotate(var(--r, 0deg));
  }
  .wish:hover{
    transform: rotate(var(--r, 0deg)) translateY(-5px);
    box-shadow: 0 18px 30px -12px rgba(0,0,0,.6), 0 3px 8px rgba(0,0,0,.25);
  }
  .wish:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  .wish::before{
    content: '';
    position: absolute;
    top: -13px;
    left: 50%;
    width: 62px;
    height: 24px;
    transform: translateX(-50%) rotate(-3deg);
    background: linear-gradient(180deg, rgba(240,192,90,.9), rgba(240,192,90,.55));
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }

  .wish-text{
    display: block;
    transition: opacity .3s ease;
  }

  .wish.done{
    opacity: .6;
  }
  .wish.done .wish-text{
    text-decoration: line-through;
    text-decoration-color: var(--gold-soft);
    text-decoration-thickness: 2px;
  }
  .wish.done::after{
    content: 'ours ✓';
    position: absolute;
    right: -10px;
    bottom: -12px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1rem;
    color: var(--gold);
    border: 2px solid var(--gold);
    border-radius: 999px;
    padding: .15rem .7rem;
    transform: rotate(-9deg);
    background: rgba(250, 246, 236, .92);
  }

  .spark{
    position: absolute;
    pointer-events: none;
    color: var(--gold);
    font-size: 15px;
    transform: translate(-50%, -50%);
    animation: sparkle-burst .65s ease-out forwards;
  }
  @keyframes sparkle-burst{
    0%   { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15); opacity: 0; }
  }

  .add-card{
    max-width: 360px;
    margin: 3rem auto 0;
    background: rgba(255,255,255,.04);
    border: 1.5px dashed rgba(255,255,255,.28);
    border-radius: 6px;
    padding: 1.4rem 1.3rem;
    text-align: center;
  }
  .add-card p{
    margin: 0 0 .9rem;
    color: var(--muted);
    font-size: .95rem;
  }
  .add-form{
    display: flex;
    gap: .6rem;
  }
  .add-form input{
    flex: 1;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 5px;
    padding: .65rem .8rem;
    color: var(--text);
    font-family: 'Fraunces', serif;
    font-size: .95rem;
  }
  .add-form input::placeholder{ color: var(--muted); }
  .add-form input:focus-visible, .add-form button:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .add-form button{
    background: var(--gold);
    color: #2c2440;
    border: none;
    border-radius: 5px;
    padding: .65rem 1.1rem;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: .92rem;
    cursor: pointer;
    transition: background .15s ease;
  }
  .add-form button:hover{ background: var(--gold-soft); }

  .reset-link{
    display: block;
    margin: 2.2rem auto 0;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Fraunces', serif;
    font-size: .85rem;
    text-decoration: underline;
    text-decoration-color: transparent;
    cursor: pointer;
    transition: text-decoration-color .15s ease;
  }
  .reset-link:hover{ text-decoration-color: var(--muted); }

  @media (max-width: 480px){
    .wrap{ padding: 3rem 1.1rem 4rem; }
    .add-form{ flex-direction: column; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<main class="wrap">
  <header>
    <h1>Everything We<br>Still Get To Do</h1>
    <p class="subtitle">A running list of our future together. Tap one off when it happens. Add more whenever something new comes to mind.</p>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">loading…</span>
    </div>
  </header>

  <section class="board" id="board" aria-label="Our future wishes"></section>

  <div class="add-card">
    <p>the next thing we haven't done yet</p>
    <form class="add-form" id="addForm">
      <label for="addInput" class="sr-only" style="position:absolute;left:-9999px;">Add a new wish</label>
      <input type="text" id="addInput" placeholder="something we still want to do…" maxlength="140" autocomplete="off">
      <button type="submit">Pin it</button>
    </form>
  </div>

  <button class="reset-link" id="resetBtn" type="button">start the list over</button>
</main>

<script>
  const DEFAULT_TEXTS = [
    "Watch a meteor shower and actually see one",
    "Learn to cook one dish so well we never need the recipe again",
    "Take a road trip with no fixed destination",
    "Get properly lost in a city we've never been to",
    "Learn a few words of a language neither of us speaks",
    "Adopt something small and give it a ridiculous name",
    "Watch the sunrise from somewhere higher than home",
    "Build a blanket fort and refuse to leave it",
    "Slow dance in the kitchen for no reason",
    "Write letters to open on a random day, years from now",
    "Learn to grow something and somehow keep it alive",
    "Fall asleep mid-conversation about something ridiculous"
  ];
  const STORAGE_KEY = 'future-list-items';

  const board = document.getElementById('board');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const addForm = document.getElementById('addForm');
  const addInput = document.getElementById('addInput');
  const resetBtn = document.getElementById('resetBtn');

  let items = [];
  let storageAvailable = true;

  function defaultItems(){
    return DEFAULT_TEXTS.map((t, i) => ({ id: 'd' + i, text: t, done: false }));
  }

  async function loadItems(){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value) return JSON.parse(res.value);
      return defaultItems();
    }catch(e){
      storageAvailable = false;
      return defaultItems();
    }
  }

  async function saveItems(list){
    if(!storageAvailable) return;
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(list));
    }catch(e){
      storageAvailable = false;
    }
  }

  function rotationFor(id){
    let hash = 0;
    for(const c of String(id)) hash = (hash * 31 + c.charCodeAt(0)) % 1000;
    return (hash % 7) - 3;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateProgress(){
    const total = items.length;
    const done = items.filter(i => i.done).length;
    progressLabel.textContent = total ? `${done} of ${total} already ours` : 'add your first wish below';
    progressFill.style.width = total ? `${(done / total) * 100}%` : '0%';
  }

  function spawnSparkles(cardEl, evt){
    const rect = cardEl.getBoundingClientRect();
    const originX = evt ? evt.clientX - rect.left : rect.width / 2;
    const originY = evt ? evt.clientY - rect.top : rect.height / 2;
    for(let i = 0; i < 7; i++){
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = i % 2 ? '✦' : '✧';
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      s.style.left = originX + 'px';
      s.style.top = originY + 'px';
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      cardEl.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }
  }

  async function toggleItem(id, cardEl, evt){
    const item = items.find(i => i.id === id);
    if(!item) return;
    item.done = !item.done;
    cardEl.classList.toggle('done', item.done);
    if(item.done) spawnSparkles(cardEl, evt);
    updateProgress();
    await saveItems(items);
  }

  function render(){
    board.innerHTML = '';
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'wish' + (item.done ? ' done' : '');
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-pressed', String(item.done));
      card.style.setProperty('--r', rotationFor(item.id) + 'deg');
      card.innerHTML = `<span class="wish-text">${escapeHtml(item.text)}</span>`;
      card.addEventListener('click', (e) => toggleItem(item.id, card, e));
      card.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          toggleItem(item.id, card, null);
        }
      });
      board.appendChild(card);
    });
    updateProgress();
  }

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = addInput.value.trim();
    if(!text) return;
    items.push({ id: 'u' + Date.now(), text, done: false });
    addInput.value = '';
    render();
    await saveItems(items);
  });

  resetBtn.addEventListener('click', async () => {
    if(!confirm("Start the list over? This clears everything you two have added.")) return;
    items = defaultItems();
    render();
    await saveItems(items);
  });

  function buildStars(){
    const container = document.getElementById('stars');
    const frag = document.createDocumentFragment();
    for(let i = 0; i < 70; i++){
      const star = document.createElement('span');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      const size = (Math.random() * 2 + 1).toFixed(2);
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.animationDelay = (Math.random() * 6).toFixed(2) + 's';
      star.style.animationDuration = (3 + Math.random() * 4).toFixed(2) + 's';
      frag.appendChild(star);
    }
    container.appendChild(frag);
  }

  (async function init(){
    buildStars();
    items = await loadItems();
    render();
  })();
</script>

</body>
</html>
